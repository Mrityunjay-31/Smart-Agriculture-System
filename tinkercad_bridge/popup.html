<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 250px;
            font-family: Inter, sans-serif;
            padding: 10px;
        }

        h3 {
            margin-top: 0;
            color: #166534;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
            padding: 5px;
        }

        button {
            background: #166534;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #14532d;
        }
    </style>
</head>

<body>
    <h3>Tinkercad Bridge</h3>
    <label style="font-size: 12px; display: block; margin-bottom: 5px;">Bridge Token:</label>
    <input type="text" id="tokenInput" placeholder="Enter token..." value="dev-secret-token-123">
    <button id="saveBtn">Save Token</button>
    <p id="status" style="font-size: 12px; color: green; display: none;">Saved!</p>

    <script src="popup.js"></script>
</body>

</html>
