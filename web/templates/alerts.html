<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Smart Agro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .alerts-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .alert-item {
            background-color: var(--bg-card);
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-item.critical {
            border-color: var(--error);
            background: linear-gradient(to right, rgba(239, 68, 68, 0.05), transparent);
        }

        .alert-item.warning {
            border-color: var(--warning);
            background: linear-gradient(to right, rgba(245, 158, 11, 0.05), transparent);
        }

        .alert-meta {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .alert-msg {
            font-size: 1.125rem;
            font-weight: 500;
        }

        .alert-val {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .ack-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ack-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="text-primary">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z">
                        </path>
                        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
                    </svg>
                    Smart Agro
                </div>
            </div>
            <nav class="nav-links">
                <a href="/dashboard" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Dashboard
                </a>
                <a href="/sensors" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M12 2v20"></path>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                    Sensors
                </a>
                <a href="/alerts" class="nav-link active">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    Alerts
                </a>
                <a href="/reports" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Reports
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2 class="page-title">Active Alerts</h2>
            </header>

            <div class="content-container">
                <div class="alerts-list" id="alertsList">
                    <p style="color: var(--text-muted);">Loading alerts...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function fetchAlerts() {
            try {
                const res = await fetch('/api/alerts');
                if (res.ok) {
                    const sortedAlerts = await res.json();
                    const list = document.getElementById('alertsList');
                    list.innerHTML = '';

                    if (sortedAlerts.length === 0) {
                        list.innerHTML = '<p style="color: var(--text-muted); text-align:center; padding: 2rem;">No active alerts. All systems nominal.</p>';
                        return;
                    }

                    sortedAlerts.forEach(alert => {
                        const date = new Date(alert.timestamp);
                        const isCrit = alert.severity === 'CRITICAL';
                        const el = document.createElement('div');
                        el.className = `alert-item ${isCrit ? 'critical' : 'warning'}`;
                        el.innerHTML = `
                            <div>
                                <div class="alert-meta">${alert.sensor.toUpperCase()} • ${date.toLocaleString()}</div>
                                <div class="alert-msg">${alert.message}</div>
                            </div>
                            <div style="text-align: right;">
                                <div class="alert-val" style="color: ${isCrit ? 'var(--error)' : 'var(--warning)'}">${alert.value.toFixed(1)}</div>
                            </div>
                        `;
                        list.appendChild(el);
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        fetchAlerts();
        setInterval(fetchAlerts, 10000);
    </script>
</body>

</html>
