<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Smart Agro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    Smart Agro
                </div>
            </div>
            <nav class="nav-links">
                <a href="/dashboard" class="nav-link">Dashboard</a>
                <a href="/sensors" class="nav-link">Sensors</a>
                <a href="/alerts" class="nav-link">Alerts</a>
                <a href="/reports" class="nav-link active">Reports</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2 class="page-title">Generate Reports</h2>
            </header>
            <div class="content-container">
                <div class="data-card" style="padding: 2rem; max-width: 600px; margin: 0 auto; text-align: center;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        style="color: var(--primary); margin-bottom: 1rem;">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    <h3 style="margin-bottom: 0.5rem;">Farm Health Report</h3>
                    <p style="color:var(--text-muted); margin-bottom:2rem;">Export your historical data and AI analysis
                        as a PDF or CSV.</p>

                    <button class="btn-primary" style="margin-bottom: 1rem;"
                        onclick="alert('PDF generation will be available in the next release.')">Export as PDF</button>
                    <button class="btn-primary"
                        style="background-color: transparent; border: 1px solid var(--primary); color: var(--primary);"
                        onclick="window.location.href='/api/sensors/history?limit=1000'">Export as JSON / CSV API
                        Format</button>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
