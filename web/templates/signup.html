<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Agriculture Monitoring System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="subtitle">Join Smart Agro to monitor your farm</p>

            <div id="alertBox" class="alert"></div>

            <form id="signupForm" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="farmer@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6"
                        placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary" id="signupBtn">Sign Up</button>
            </form>

            <div class="auth-links">
                <p>Already have an account? <a href="/login">Sign in</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            const alertBox = document.getElementById('alertBox');

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alertBox.textContent = 'Passwords do not match.';
                alertBox.className = 'alert error';
                alertBox.style.display = 'block';
                return;
            }

            btn.textContent = 'Creating...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, confirmPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    alertBox.textContent = data.message || 'Signup failed. Please try again.';
                    alertBox.className = 'alert error';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.textContent = 'Network error occurred. Please try again.';
                alertBox.className = 'alert error';
                alertBox.style.display = 'block';
            } finally {
                btn.textContent = 'Sign Up';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
