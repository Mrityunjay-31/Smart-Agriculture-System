<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart Agro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your email to receive a reset link</p>

            <div id="alertBox" class="alert"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="farmer@example.com">
                </div>
                <button type="submit" class="btn-primary" id="resetBtn">Send Reset Link</button>
            </form>

            <div class="auth-links">
                <p>Remember your password? <a href="/login">Sign in</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = document.getElementById('resetBtn');
            const alertBox = document.getElementById('alertBox');

            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    alertBox.textContent = 'Reset link sent! Check your email.';
                    alertBox.className = 'alert success';
                    alertBox.style.display = 'block';
                } else {
                    alertBox.textContent = data.message || 'Failed to send link.';
                    alertBox.className = 'alert error';
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.textContent = 'Network error.';
                alertBox.className = 'alert error';
                alertBox.style.display = 'block';
            } finally {
                btn.textContent = 'Send Reset Link';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
