# ─── Sensor Threshold Configuration ─────────────────────────────────────────
# Format: sensor.parameter = value
# Status levels: OPTIMAL, WARNING, CRITICAL

# Temperature (°C)
temperature.optimal_min = 18.0
temperature.optimal_max = 30.0
temperature.warning_min = 10.0
temperature.warning_max = 38.0
# Below warning_min or above warning_max → CRITICAL

# Humidity (%)
humidity.optimal_min = 40.0
humidity.optimal_max = 80.0
humidity.warning_min = 25.0
humidity.warning_max = 90.0

# Soil Moisture (%)
soil_moisture.optimal_min = 30.0
soil_moisture.optimal_max = 70.0
soil_moisture.warning_min = 15.0
soil_moisture.warning_max = 85.0

# pH Level
ph.optimal_min = 5.5
ph.optimal_max = 7.5
ph.warning_min = 4.5
ph.warning_max = 8.5

# Light Intensity (%)
light.optimal_min = 30.0
light.optimal_max = 100.0
light.warning_min = 15.0
light.warning_max = 100.0
