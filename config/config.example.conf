# ─── Smart Agriculture System Configuration ─────────────────────────────────
# Copy this file to config.conf and fill in your values.

# Serial device path (Linux character device)
serial.device = /dev/ttyACM0
serial.baud = 9600

# Application mode: arduino | simulation
app.mode = simulation

# Web server
server.port = 8080
server.host = 0.0.0.0

# Data pipeline
pipeline.read_interval_ms = 3000
pipeline.upload_interval_ms = 5000

# Dashboard refresh (milliseconds)
dashboard.refresh_ms = 5000

# Farm defaults
farm.id = farm_001
farm.name = Green Valley Farm
farm.location = Bhubaneswar, Odisha
farm.crop = Tomato
